spring.application.name=watchlist-service

spring.datasource.url=jdbc:h2:mem:watchlistdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables for you from your Java classes
# prints the SQL it generates in the console.
# Keep this on; it’s how you learn what JPA is actually doing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#gives you a web page at http://localhost:8080/h2-console to
# browse the tables with real SQL. You didn’t use this last time and it’s genuinely useful.
spring.h2.console.enabled=true